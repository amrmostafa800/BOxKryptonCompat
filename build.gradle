plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.boykrypto.compat'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'boykryptoncompat.refmap.json'
    config 'boykryptoncompat.mixins.json'
}

repositories {
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // BandwidthOptimizer compiled against (not bundled): provides ConnectionInternetProbeGuard.
    compileOnly files('libs/BO-139.jar')
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'boykryptoncompat',
                'Specification-Vendor'    : 'boykrypto',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'boykrypto',
                'MixinConfigs'            : 'boykryptoncompat.mixins.json'
        ])
    }
}
